<svg
  width="120"
  height="120"
  viewBox="0 0 120 120"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Headphones (secondary: pink) -->
  <g>
    <!-- Left ear cup -->
    <ellipse
      cx="30"
      cy="48"
      rx="20"
      ry="24"
      fill="#e4a2b1"
      stroke="white"
      stroke-width="2.5"
    />
    <!-- Right ear cup -->
    <ellipse
      cx="90"
      cy="48"
      rx="20"
      ry="24"
      fill="#e4a2b1"
      stroke="white"
      stroke-width="2.5"
    />
    <!-- Headband -->
    <path
      d="M 30 36 Q 60 18 90 36"
      stroke="#e4a2b1"
      stroke-width="10"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Headband border for better visibility -->
    <path
      d="M 30 36 Q 60 18 90 36"
      stroke="white"
      stroke-width="12"
      stroke-linecap="round"
      fill="none"
      opacity="0.3"
    />
  </g>

  <!-- Face (primary: yellow) -->
  <circle
    cx="60"
    cy="62"
    r="36"
    fill="#fbe2a7"
  />

  <!-- Eyes -->
  <circle cx="50" cy="58" r="5" fill="white" />
  <circle cx="70" cy="58" r="5" fill="white" />

  <!-- Smile -->
  <path
    d="M 45 75 Q 60 85 75 75"
    stroke="white"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />
</svg>

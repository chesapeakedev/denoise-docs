services:
  denoise-docs:
    image: denoise-docs:latest
    restart: unless-stopped
    ports:
      - "4321:4321"
    env_file:
      - .env
    volumes:
      - kv-data:/root/.deno/kv

volumes:
  # Fixed name so deploy dir / COMPOSE_PROJECT_NAME changes cannot create a new empty volume.
  kv-data:
    name: denoise-docs_kv-data
